name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ninja, plus the X11 and Wayland headers SDL3 builds its Linux window backends against.
  LINUX_PACKAGES: >-
    ninja-build libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev
  # The Vulkan loader, Mesa's lavapipe (a CPU Vulkan 1.3 driver) and the Khronos validation layer:
  # the RHI tests run for real on Linux CI, with validation on.
  LINUX_TEST_PACKAGES: >-
    libvulkan1 mesa-vulkan-drivers vulkan-validationlayers

jobs:
  build:
    name: Build & test (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: msvc }
          - { os: ubuntu-24.04, preset: linux-clang }
          - { os: ubuntu-24.04, preset: linux-gcc }

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES $LINUX_TEST_PACKAGES

      # The GPU tests skip without a Vulkan device; on Linux lavapipe is one, so they must run.
      - name: Require a Vulkan device for the tests
        if: runner.os == 'Linux'
        run: echo "DE_REQUIRE_GPU=1" >> "$GITHUB_ENV"

      - name: Set up MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (debug)
        run: cmake --build --preset ${{ matrix.preset }}-debug

      - name: Test (debug)
        run: ctest --preset ${{ matrix.preset }}-debug

      # Names, metas and folder rules of content/ and meta/: what a cook would change, as errors.
      - name: Check assets
        run: build/${{ matrix.preset }}/bin/Debug/cooker --check

      - name: Build (ship)
        run: cmake --build --preset ${{ matrix.preset }}-ship

      - name: Test (ship)
        run: ctest --preset ${{ matrix.preset }}-ship

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore

  lint:
    name: clang-format & clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Same LLVM major as Visual Studio's bundled clang tools, so local and CI formatting agree.
      - name: Install LLVM 22 tools
        # apt.llvm.org drops connections now and then: retry before failing the job.
        run: |
          for attempt in 1 2 3 4 5; do
            wget -qO llvm.sh --tries=3 --retry-connrefused https://apt.llvm.org/llvm.sh && chmod +x llvm.sh &&
              sudo ./llvm.sh 22 && break
            echo "LLVM install attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          sudo apt-get install -y clang-format-22 clang-tidy-22 $LINUX_PACKAGES

      - name: clang-format
        run: git ls-files '*.h' '*.hpp' '*.cpp' | xargs clang-format-22 --dry-run --Werror

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-clang

      - name: Configure (compile_commands.json for clang-tidy)
        run: cmake --preset linux-clang

      # Windows-only sources aren't compiled on Linux, so they have no compile command here.
      - name: clang-tidy
        run: git ls-files '*.cpp' ':!:*_win32.cpp' | xargs -P "$(nproc)" -n 1 clang-tidy-22 -p build/linux-clang --quiet
