name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: msvc }
          - { os: ubuntu-24.04, preset: linux-clang }
          - { os: ubuntu-24.04, preset: linux-gcc }

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (debug)
        run: cmake --build --preset ${{ matrix.preset }}-debug

      - name: Test (debug)
        run: ctest --preset ${{ matrix.preset }}-debug

      - name: Build (ship)
        run: cmake --build --preset ${{ matrix.preset }}-ship

      - name: Test (ship)
        run: ctest --preset ${{ matrix.preset }}-ship

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore

  lint:
    name: clang-format & clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Same LLVM major as Visual Studio's bundled clang tools, so local and CI formatting agree.
      - name: Install LLVM 22 tools
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22 clang-tidy-22 ninja-build

      - name: clang-format
        run: git ls-files '*.h' '*.hpp' '*.cpp' | xargs clang-format-22 --dry-run --Werror

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-clang

      - name: Configure (compile_commands.json for clang-tidy)
        run: cmake --preset linux-clang

      - name: clang-tidy
        run: git ls-files '*.cpp' | xargs -P "$(nproc)" -n 1 clang-tidy-22 -p build/linux-clang --quiet
